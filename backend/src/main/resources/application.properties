server.port=8080

# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/calendario?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson: ISO-8601, no timestamps as arrays ---
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================================================
# Credenciales NO se almacenan aquí.
# Cada usuario las introduce desde la app (Ajustes > Cuentas).
# Quedan guardadas en la tabla app_setting de la base de datos local.
# =============================================================================

# --- Google OAuth2 (vacío: el usuario lo rellena desde Ajustes) ---
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=

# --- ProCalendar sync (deshabilitado por defecto; usuario activa desde Ajustes) ---
procalendar.sync.google.enabled=false
procalendar.sync.google.calendar-id=primary

procalendar.sync.icloud.enabled=false
procalendar.sync.icloud.apple-id=
procalendar.sync.icloud.app-password=
procalendar.sync.icloud.calendar-url=
