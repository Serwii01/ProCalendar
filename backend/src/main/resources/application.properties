server.port=8080

# =============================================================================
# Base de datos: por defecto H2 EMBEBIDO (file-based) — sin servicios externos.
# El archivo vive en ~/.procalendar/data.mv.db en cada usuario.
# Para usar MySQL en su lugar, exporta antes de arrancar:
#   set PROCAL_DB_URL=jdbc:mysql://localhost:3306/calendario?...&createDatabaseIfNotExist=true
#   set PROCAL_DB_USER=root
#   set PROCAL_DB_PASSWORD=
#   set PROCAL_DB_DRIVER=com.mysql.cj.jdbc.Driver
# =============================================================================
spring.datasource.url=${PROCAL_DB_URL:jdbc:h2:file:${user.home}/.procalendar/data;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${PROCAL_DB_USER:sa}
spring.datasource.password=${PROCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=${PROCAL_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson: ISO-8601, no timestamps as arrays ---
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================================================
# Credenciales — el usuario las introduce desde Ajustes > Cuentas.
# Quedan guardadas en la tabla app_setting (de la BD H2/MySQL local).
# =============================================================================

# --- Google OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=

# --- ProCalendar sync (deshabilitado por defecto; usuario activa desde Ajustes) ---
procalendar.sync.google.enabled=false
procalendar.sync.google.calendar-id=primary

procalendar.sync.icloud.enabled=false
procalendar.sync.icloud.apple-id=
procalendar.sync.icloud.app-password=
procalendar.sync.icloud.calendar-url=
